<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Page Numbers — PDFPro</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo"><i class="fa-solid fa-file-pdf"></i><span>PDF<strong>Pro</strong></span></a>
    <ul class="nav-links"><li><a href="index.html#tools">All Tools</a></li></ul>
    <div class="nav-cta"><a href="index.html" class="btn-outline">← Back to Home</a></div>
    <button class="hamburger" id="hamburger"><i class="fa fa-bars"></i></button>
  </div>
</nav>

<section class="tool-page">
  <div class="container" style="max-width:680px">
    <div class="tool-page-header">
      <div class="tool-page-icon" style="background:rgba(14,165,233,.12);color:var(--teal)">
        <i class="fa-solid fa-list-ol"></i>
      </div>
      <h1>Add Page Numbers</h1>
      <p>Automatically add page numbers to every page of your PDF.</p>
    </div>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".pdf"/>
      <div class="drop-zone-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
      <h3>Drop a PDF file here</h3>
      <p>or click to select</p>
      <a class="btn-primary" style="pointer-events:none">Select PDF File</a>
    </div>

    <div id="toolUI" style="display:none">
      <div class="file-list" id="fileList"></div>
      <div class="tool-options">
        <h3>Page Number Settings</h3>
        <div class="option-row">
          <div><div class="option-label">Position</div></div>
          <select id="position">
            <option value="bottom-center" selected>Bottom Center</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="bottom-right">Bottom Right</option>
            <option value="top-center">Top Center</option>
            <option value="top-left">Top Left</option>
            <option value="top-right">Top Right</option>
          </select>
        </div>
        <div class="option-row">
          <div><div class="option-label">Format</div></div>
          <select id="format">
            <option value="n" selected>1, 2, 3…</option>
            <option value="page-n">Page 1, Page 2…</option>
            <option value="n-of-total">1 of 10, 2 of 10…</option>
            <option value="roman">i, ii, iii…</option>
          </select>
        </div>
        <div class="option-row">
          <div><div class="option-label">Starting Number</div></div>
          <input type="number" class="tool-input" id="startNum" value="1" min="1" style="max-width:100px"/>
        </div>
        <div class="option-row">
          <div><div class="option-label">Font Size</div></div>
          <div class="slider-wrap">
            <input type="range" id="fontSize" min="8" max="24" value="12" oninput="document.getElementById('fontSizeVal').textContent=this.value+'pt'"/>
            <span class="slider-val" id="fontSizeVal">12pt</span>
          </div>
        </div>
        <div class="option-row">
          <div><div class="option-label">Color</div></div>
          <input type="color" id="numColor" value="#333333"/>
        </div>
      </div>

      <div class="action-area">
        <div class="progress-wrap" id="progressWrap">
          <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
          <div class="progress-text" id="progressText">0%</div>
        </div>
        <button class="btn-action" id="applyBtn">
          <i class="fa-solid fa-list-ol"></i> Add Page Numbers
        </button>
      </div>

      <div class="result-box" id="resultBox">
        <div class="result-icon"><i class="fa-solid fa-circle-check"></i></div>
        <h3>Page Numbers Added!</h3>
        <p id="resultInfo"></p>
        <a id="downloadLink" class="btn-download"><i class="fa-solid fa-download"></i> Download PDF</a>
        <br/><br/>
        <button onclick="resetTool()" class="btn-outline">Process Another File</button>
      </div>
    </div>
  </div>
</section>

<script src="main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const { PDFDocument, rgb, StandardFonts } = PDFLib;
let pdfFile = null;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));

function loadFile(file) {
  if (!file || file.type !== 'application/pdf') { showToast('Please select a PDF file', 'error'); return; }
  pdfFile = file;
  document.getElementById('fileList').innerHTML = `<div class="file-item"><i class="fa-solid fa-file-pdf file-item-icon"></i><div class="file-item-info"><div class="file-item-name">${file.name}</div><div class="file-item-size">${formatSize(file.size)}</div></div></div>`;
  document.getElementById('toolUI').style.display = 'block';
  dropZone.style.display = 'none';
}

function toRoman(n) {
  const vals=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const syms=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let result='';
  for(let i=0;i<vals.length;i++){while(n>=vals[i]){result+=syms[i];n-=vals[i];}}
  return result.toLowerCase();
}

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16)/255, g: parseInt(hex.slice(3,5),16)/255, b: parseInt(hex.slice(5,7),16)/255 };
}

document.getElementById('applyBtn').addEventListener('click', async () => {
  const btn = document.getElementById('applyBtn');
  btn.disabled = true;
  const pw = document.getElementById('progressWrap');
  const pb = document.getElementById('progressBar');
  const pt = document.getElementById('progressText');
  pw.style.display = 'block';

  try {
    const position = document.getElementById('position').value;
    const format = document.getElementById('format').value;
    const startNum = parseInt(document.getElementById('startNum').value) || 1;
    const fontSize = parseInt(document.getElementById('fontSize').value);
    const { r, g, b } = hexToRgb(document.getElementById('numColor').value);

    await animateProgress(pb, pt, 0, 30, 400);
    const buf = await pdfFile.arrayBuffer();
    const doc = await PDFDocument.load(buf);
    const font = await doc.embedFont(StandardFonts.Helvetica);
    const pages = doc.getPages();
    const total = pages.length;

    pages.forEach((page, i) => {
      const { width, height } = page.getSize();
      const n = startNum + i;
      let text;
      if (format === 'n') text = String(n);
      else if (format === 'page-n') text = 'Page ' + n;
      else if (format === 'n-of-total') text = n + ' of ' + (startNum + total - 1);
      else text = toRoman(n);

      const tw = font.widthOfTextAtSize(text, fontSize);
      const margin = 28;
      let x, y;
      if (position === 'bottom-center') { x = (width - tw) / 2; y = margin; }
      else if (position === 'bottom-left') { x = margin; y = margin; }
      else if (position === 'bottom-right') { x = width - tw - margin; y = margin; }
      else if (position === 'top-center') { x = (width - tw) / 2; y = height - margin - fontSize; }
      else if (position === 'top-left') { x = margin; y = height - margin - fontSize; }
      else { x = width - tw - margin; y = height - margin - fontSize; }

      page.drawText(text, { x, y, size: fontSize, font, color: rgb(r, g, b) });
      pb.style.width = Math.round(30 + (i / total) * 60) + '%';
    });

    await animateProgress(pb, pt, 90, 100, 300);
    const bytes = await doc.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    document.getElementById('downloadLink').href = URL.createObjectURL(blob);
    document.getElementById('downloadLink').download = 'numbered.pdf';
    document.getElementById('resultInfo').textContent = `Page numbers added to ${total} pages → ${formatSize(bytes.byteLength)}`;
    pw.style.display = 'none';
    document.getElementById('resultBox').style.display = 'block';
    btn.style.display = 'none';
  } catch(err) {
    showToast('Error: ' + err.message, 'error');
    pw.style.display = 'none'; btn.disabled = false;
  }
});

function resetTool() {
  pdfFile = null;
  document.getElementById('toolUI').style.display = 'none';
  document.getElementById('resultBox').style.display = 'none';
  document.getElementById('applyBtn').style.display = 'inline-flex';
  document.getElementById('applyBtn').disabled = false;
  dropZone.style.display = 'block'; fileInput.value = '';
}
</script>
</body>
</html>
