<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Merge PDF — PDFPro</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .merge-list { margin: 20px 0; display: flex; flex-direction: column; gap: 10px; }
    .merge-item {
      display: flex; align-items: center; gap: 14px;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 14px 18px; cursor: grab; user-select: none; transition: all .2s;
    }
    .merge-item:active { cursor: grabbing; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    .merge-item.dragging { opacity: .5; }
    .merge-item.drag-target { border-color: var(--red); background: #fef2f2; }
    .merge-drag-handle { color: var(--muted); font-size: 1.1rem; }
    .merge-order { background: var(--red); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo"><i class="fa-solid fa-file-pdf"></i><span>PDF<strong>Pro</strong></span></a>
    <ul class="nav-links">
      <li><a href="index.html#tools"><i class="fa fa-grid-2"></i> All Tools</a></li>
    </ul>
    <div class="nav-cta"><a href="index.html" class="btn-outline">← Back to Home</a></div>
    <button class="hamburger" id="hamburger"><i class="fa fa-bars"></i></button>
  </div>
</nav>

<section class="tool-page">
  <div class="container" style="max-width:720px">
    <div class="tool-page-header">
      <div class="tool-page-icon" style="background:rgba(230,57,70,.12);color:var(--red)">
        <i class="fa-solid fa-object-group"></i>
      </div>
      <h1>Merge PDF</h1>
      <p>Combine multiple PDF files into a single document. Drag to reorder before merging.</p>
    </div>

    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".pdf" multiple/>
      <div class="drop-zone-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
      <h3>Drop PDF files here</h3>
      <p>or click to select files from your device</p>
      <a class="btn-primary" style="pointer-events:none">Select PDF Files</a>
    </div>

    <!-- File list with drag-to-reorder -->
    <div class="merge-list" id="mergeList"></div>

    <!-- Action -->
    <div class="action-area" id="actionArea" style="display:none">
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">0%</div>
      </div>
      <button class="btn-action" id="mergeBtn">
        <i class="fa-solid fa-object-group"></i> Merge PDFs
      </button>
    </div>

    <!-- Result -->
    <div class="result-box" id="resultBox">
      <div class="result-icon"><i class="fa-solid fa-circle-check"></i></div>
      <h3>Merged Successfully!</h3>
      <p id="resultInfo"></p>
      <a id="downloadLink" class="btn-download"><i class="fa-solid fa-download"></i> Download Merged PDF</a>
      <br/><br/>
      <button onclick="resetTool()" class="btn-outline">Merge More Files</button>
    </div>
  </div>
</section>

<script src="main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const { PDFDocument } = PDFLib;
let files = [];
let dragSrc = null;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const mergeList = document.getElementById('mergeList');
const actionArea = document.getElementById('actionArea');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  addFiles([...e.dataTransfer.files]);
});
fileInput.addEventListener('change', () => addFiles([...fileInput.files]));

function addFiles(newFiles) {
  newFiles.filter(f => f.type === 'application/pdf').forEach(f => files.push(f));
  renderList();
}

function renderList() {
  mergeList.innerHTML = '';
  if (!files.length) { actionArea.style.display = 'none'; return; }
  actionArea.style.display = 'block';
  files.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'merge-item';
    item.draggable = true;
    item.dataset.idx = i;
    item.innerHTML = `
      <span class="merge-drag-handle"><i class="fa fa-grip-vertical"></i></span>
      <span class="merge-order">${i + 1}</span>
      <i class="fa-solid fa-file-pdf file-item-icon"></i>
      <div class="file-item-info">
        <div class="file-item-name">${f.name}</div>
        <div class="file-item-size">${formatSize(f.size)}</div>
      </div>
      <button class="file-item-remove" onclick="removeFile(${i})"><i class="fa fa-times"></i></button>
    `;
    item.addEventListener('dragstart', dragStart);
    item.addEventListener('dragover', dragOver);
    item.addEventListener('drop', dragDrop);
    item.addEventListener('dragend', dragEnd);
    mergeList.appendChild(item);
  });
}

function dragStart(e) { dragSrc = +this.dataset.idx; this.classList.add('dragging'); }
function dragOver(e) { e.preventDefault(); document.querySelectorAll('.merge-item').forEach(el => el.classList.remove('drag-target')); this.classList.add('drag-target'); }
function dragEnd() { document.querySelectorAll('.merge-item').forEach(el => { el.classList.remove('dragging'); el.classList.remove('drag-target'); }); }
function dragDrop(e) { e.preventDefault(); const destIdx = +this.dataset.idx; if (dragSrc === destIdx) return; const moved = files.splice(dragSrc, 1)[0]; files.splice(destIdx, 0, moved); renderList(); }

function removeFile(i) { files.splice(i, 1); renderList(); }

document.getElementById('mergeBtn').addEventListener('click', async () => {
  if (files.length < 2) { showToast('Add at least 2 PDF files to merge', 'error'); return; }
  const btn = document.getElementById('mergeBtn');
  btn.disabled = true;
  const pw = document.getElementById('progressWrap');
  const pb = document.getElementById('progressBar');
  const pt = document.getElementById('progressText');
  pw.style.display = 'block';

  try {
    await animateProgress(pb, pt, 0, 20, 300);
    const mergedPdf = await PDFDocument.create();

    for (let i = 0; i < files.length; i++) {
      const buf = await files[i].arrayBuffer();
      const doc = await PDFDocument.load(buf);
      const pages = await mergedPdf.copyPages(doc, doc.getPageIndices());
      pages.forEach(p => mergedPdf.addPage(p));
      await animateProgress(pb, pt, 20 + (i / files.length) * 60, 20 + ((i + 1) / files.length) * 60, 300);
    }

    await animateProgress(pb, pt, 80, 95, 400);
    const bytes = await mergedPdf.save();
    await animateProgress(pb, pt, 95, 100, 200);

    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    document.getElementById('downloadLink').href = url;
    document.getElementById('downloadLink').download = 'merged.pdf';
    document.getElementById('resultInfo').textContent = `${files.length} files merged → ${formatSize(bytes.byteLength)}`;

    pw.style.display = 'none';
    document.getElementById('resultBox').style.display = 'block';
    actionArea.querySelector('.btn-action').style.display = 'none';
  } catch (err) {
    showToast('Error merging PDFs: ' + err.message, 'error');
    pw.style.display = 'none';
    btn.disabled = false;
  }
});

function resetTool() {
  files = [];
  renderList();
  document.getElementById('resultBox').style.display = 'none';
  document.getElementById('actionArea').querySelector('.btn-action').style.display = 'inline-flex';
  document.getElementById('mergeBtn').disabled = false;
  fileInput.value = '';
}
</script>
</body>
</html>
